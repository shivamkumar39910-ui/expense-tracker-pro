{% extends "base.html" %}

{% block title %}
Set Monthly Budget
{% endblock %}

{% block content %}

<div class="profile-card">

    <h1>💰 Set Monthly Budget</h1>

    <form method="POST">

        <label>Monthly Budget (₹)</label>

        <input
            type="number"
            name="budget"
            placeholder="Enter monthly budget"
            required
        >

        <br><br>

        <button type="submit">
            Save Budget
        </button>

    </form>

</div>

{% endblock %}
